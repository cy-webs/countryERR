<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中心系统</title>
</head>
<body>
    <h1>请输入密钥</h1>
      <form id="loginForm">
    <input type="password" id="password" placeholder="密码" autofocus required>
    <button type="submit">确定</button>
    <p id="errorMsg" style="display:none;">密码错误</p>
  </form>
<script>
  const form = document.getElementById('loginForm');
  const pwd = document.getElementById('password');
  const err = document.getElementById('errorMsg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.style.display = 'none';
    if (pwd.value.trim() === '') {
      alert('密钥正确！');
      window.location.href=REDIRECT_URL='mainos.html';
    } else {
      err.textContent = '密码错误';
      err.style.display = 'block';
      pwd.select();
    }
  });
</script>
</body>
</html>
